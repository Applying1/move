<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moving your progress</title><meta name="robots" content="noindex">
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:#f6f4ef;color:#222}
@media (prefers-color-scheme:dark){body{background:#16161a;color:#eee}}p{max-width:30ch;text-align:center;padding:16px}</style></head>
<body><p id="m">Moving your progress to apmed33.online…</p>
<script>
/* Runs on the old address (applying1.github.io), which still holds the reviewer's saved progress. Packs it up and hands it
   to the new site in the link's # part (never sent to any server). Sign-in tokens stay behind. */
(async function () {
  const NEW = 'https://apmed33.online/', SKIP = /^(reviewer_session|reviewer_contrib_token)$/;
  const go = h => location.replace(NEW + '#' + h);
  try {
    const o = {};
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (!SKIP.test(k)) o[k] = localStorage.getItem(k) }
    if (!Object.keys(o).length) return go('import=none');
    const bytes = new TextEncoder().encode(JSON.stringify(o));
    const gz = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
    let s = ''; for (let i = 0; i < gz.length; i += 0x8000) s += String.fromCharCode.apply(null, gz.subarray(i, i + 0x8000));
    go('import=' + btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''));
  } catch (e) { document.getElementById('m').textContent = 'This browser could not pack your progress. Update it, or sign in with Google on the site to sync instead.' }
})();
</script></body></html>
